// Normalize text for matching: lowercase, trim, collapse spaces, remove punctuation
function normalizeText(s){ return s.toLowerCase().trim().replace(/[.,!?]/g,'').replace(/\s+/g,' '); }

// Build live rules from user's CATS — called fresh each time so edits always apply.
// Matching priority:
//   1. Exact sub-category name match  (e.g. user typed "market", sub is "Market") → HIGH
//   2. Sub-category name contained    → HIGH
//   3. Category name match            → MEDIUM (less specific)
function buildUserRules(){
  const rules=[];
  CATS.forEach(cat=>{
    const type=(cat.id==='salary')?'income':'expense';
    // Sub-category names → point to that specific sub
    (cat.subs||[]).forEach(sub=>{
      const kw=normalizeText(sub);
      if(kw.length>1) rules.push({kw:[kw],cat:cat.id,sub,type,conf:'high',source:'user'});
    });
    // Category name itself → first sub as default
    const catKw=normalizeText(cat.name);
    if(catKw.length>1){
      rules.push({kw:[catKw],cat:cat.id,sub:cat.subs[0]||'',type,conf:'med',source:'user'});
    }
  });
  return rules;
}

function parseQuickEntry(raw){
  if(!raw||typeof raw!=='string') return null;
  const text=raw.trim();
  if(!text) return null;

  // ── Extract first valid number ─────────────────────────────────────────────
  const amtMatch=text.match(/\b(\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)\b/);
  if(!amtMatch) return {error:'no_amount'};
  let amtRaw=amtMatch[1], amt;
  if(/[.,]\d{2}$/.test(amtRaw)&&amtRaw.replace(/[^.,]/g,'').length===1){
    amt=parseFloat(amtRaw.replace(',','.'));
  } else {
    amt=parseFloat(amtRaw.replace(/[.,]/g,''));
  }
  if(!Number.isFinite(amt)||amt<=0||amt>100000000) return {error:'invalid_amount'};

  const descNorm=normalizeText(text.replace(amtMatch[0],'').trim()) || 'hızlı giriş';
  const origDesc=text.replace(amtMatch[0],'').trim() || 'Hızlı giriş';

  // ── Step 1: Match against USER'S live categories (always up-to-date) ──────
  // User rules are rebuilt every call — so any category rename/move/add is reflected immediately
  const userRules=buildUserRules();
  const userMatched=[];
  for(const rule of userRules){
    for(const kw of rule.kw){
      // Exact match or contained in the typed description
      if(descNorm===kw || descNorm.includes(kw)){
        userMatched.push({...rule, exactMatch: descNorm===kw});
        break;
      }
    }
  }

  // If user's categories gave us a clear answer, use it — skip QE_RULES entirely
  if(userMatched.length>0){
    // Prefer exact matches, then high-conf, then first found
    userMatched.sort((a,b)=>{
      if(a.exactMatch&&!b.exactMatch) return -1;
      if(!a.exactMatch&&b.exactMatch) return 1;
      if(a.conf==='high'&&b.conf!=='high') return -1;
      if(a.conf!=='high'&&b.conf==='high') return 1;
      return 0;
    });

    // Ambiguity check: multiple high-conf matches pointing to DIFFERENT categories
    const highUser=userMatched.filter(r=>r.conf==='high');
    const uniqueCats=new Set(highUser.map(r=>r.cat));
    if(uniqueCats.size>1){
      return {amt,desc:origDesc,cat:'other',sub:'Çeşitli',type:'expense',conf:'low',ambiguous:true};
    }

    const best=userMatched[0];
    return {amt,desc:origDesc,cat:best.cat,sub:best.sub,type:best.type,conf:best.conf,ambiguous:false};
  }

  // ── Step 2: Fall back to built-in QE_RULES (generic keywords) ────────────
  const matched=[];
  for(const rule of QE_RULES){
    for(const kw of rule.kw){
      if(descNorm.includes(kw.toLowerCase())){
        matched.push(rule);
        break;
      }
    }
  }

  // Ambiguity: multiple HIGH-confidence rules pointing to different categories
  const highMatches=matched.filter(r=>r.conf==='high');
  const uniqueHighCats=new Set(highMatches.map(r=>r.cat));
  if(uniqueHighCats.size>1){
    return {amt,desc:origDesc,cat:'other',sub:'Çeşitli',type:'expense',conf:'low',ambiguous:true};
  }

  let best=null;
  for(const rule of matched){
    if(!best) best=rule;
    else if(rule.conf==='high'&&best.conf!=='high') best=rule;
  }

  return {
    amt, desc:origDesc,
    cat:  best?best.cat :'other',
    sub:  best?best.sub :'Çeşitli',
    type: best?best.type:'expense',
    conf: best?best.conf:'low',
    ambiguous:false
  };
}

// Live preview
function qeInput(){
  const val=document.getElementById('qe-input').value;
  const preview=document.getElementById('qe-preview');
  if(!val.trim()){preview.className='qe-preview';return;}
  const p=parseQuickEntry(val);
  if(!p||p.error){preview.className='qe-preview';return;}
  const c=gc(p.cat);
  const confLabel=p.conf==='high'?'Eşleşti':p.conf==='med'?'Tahmin':'Belirsiz';
  const confClass=p.conf==='high'?'qe-conf-high':p.conf==='med'?'qe-conf-med':'qe-conf-low';
  preview.className='qe-preview show';
  preview.innerHTML=`
    <div class="qe-preview-icon" style="background:${c.bg}">${c.icon}</div>
    <div class="qe-preview-body">
      <div class="qe-preview-desc">${escapeHTML(p.desc)}<span class="qe-confidence ${confClass}">${confLabel}${p.ambiguous?' ⚠':''}</span></div>
      <div class="qe-preview-meta">${escapeHTML(c.name)} → ${escapeHTML(p.sub)} · ${p.type==='income'?'Gelir':'Gider'}</div>
    </div>
    <div class="qe-preview-amt" style="color:${p.type==='income'?'var(--green)':'var(--red)'}">${p.type==='income'?'+':'−'}${fmt(p.amt)}</div>`;
}

// Show undo bar for quick-entry saves
function showUndo(txId){
  _lastQeTx=txId;
  const bar=document.getElementById('qe-undo-bar');
  if(bar){ bar.className='undo-bar show'; }
  clearTimeout(_undoTimer);
  _undoTimer=setTimeout(()=>{
    _lastQeTx=null;
    const b=document.getElementById('qe-undo-bar');
    if(b) b.className='undo-bar';
  },5000);
}

function undoQe(){
  if(!_lastQeTx) return;
  TXS=TXS.filter(t=>t.id!==_lastQeTx);
  saveTxs();
  _lastQeTx=null;
  clearTimeout(_undoTimer);
  const b=document.getElementById('qe-undo-bar');
  if(b) b.className='undo-bar';
  toast('Geri alındı','warn');
  render(activePg);
}

function qeSubmit(){
  const val=document.getElementById('qe-input').value;
  if(!val.trim()){toast('Tutar + açıklama girin','warn');return;}
  const p=parseQuickEntry(val);
  if(!p||p.error){
    const msg=(!p||p.error==='no_amount')?'Tutar bulunamadı':'Geçersiz tutar';
    toast(msg,'error');return;
  }

  if(p.conf==='high'&&!p.ambiguous){
    // Validate before saving
    const tx={id:gid(),type:p.type,amt:p.amt,cat:p.cat,sub:p.sub,
      desc:p.desc,date:todayStr(),note:'',account:DEFAULT_ACCOUNT[p.type]||'bank',
      recurring:false,freq:'',recurringId:null};
    const errs=validateTx(tx);
    if(errs.length){toast('Hata: '+errs[0],'error');return;}
    TXS=[tx,...TXS];
    saveTxs();
    const c=gc(p.cat);
    toast(`${c.icon} ${p.desc} · ${p.type==='income'?'+':'−'}${fmt(p.amt)}`,'success');
    document.getElementById('qe-input').value='';
    document.getElementById('qe-preview').className='qe-preview';
    render(activePg);
    // Show undo after render (element now exists)
    setTimeout(()=>showUndo(tx.id),50);
  } else {
    // Med/low/ambiguous → prefill modal for confirmation
    S.open(p.cat,p.type,p.amt,p.desc,p.sub);
    document.getElementById('qe-input').value='';
    document.getElementById('qe-preview').className='qe-preview';
  }
}

// ═══════════════════════════════════════════════════
// MONEY LEAK DETECTOR — 3-month average baseline
// ═══════════════════════════════════════════════════
function detectLeaks(){
  const curr=txsFor(CY,CM);
  // Build 3-month average for each category (months before current)
  const months3=[];
  for(let i=1;i<=3;i++){ let m=CM-i,y=CY; if(m<1){m+=12;y--;} months3.push(txsFor(y,m)); }

  const currByCat={};
  curr.filter(t=>t.type==='expense').forEach(t=>{currByCat[t.cat]=(currByCat[t.cat]||0)+t.amt;});

  const avgByCat={};
  const CATS_WITH_SPEND=new Set([...Object.keys(currByCat)]);
  months3.forEach(mtxs=>mtxs.filter(t=>t.type==='expense').forEach(t=>CATS_WITH_SPEND.add(t.cat)));
  CATS_WITH_SPEND.forEach(catId=>{
    const totals=months3.map(mtxs=>mtxs.filter(t=>t.type==='expense'&&t.cat===catId).reduce((s,t)=>s+t.amt,0));
    const nonZero=totals.filter(v=>v>0);
    avgByCat[catId]=nonZero.length?nonZero.reduce((s,v)=>s+v,0)/nonZero.length:0;
  });

  const alerts=[];
  // Thresholds (TRY)
  const ABS_THRESHOLD = 300;   // absolute increase must be > ₺300
  const PCT_THRESHOLD = 25;    // percentage increase must be > 25%
  const MIN_BASELINE  = 500;   // category must have spent ≥ ₺500 on average to matter

  for(const [id,currAmt] of Object.entries(currByCat)){
    const avg=avgByCat[id]||0;
    if(avg<MIN_BASELINE) continue;                   // ignore tiny categories
    const absDiff=currAmt-avg;
    const pctDiff=((currAmt-avg)/avg)*100;
    if(absDiff<=ABS_THRESHOLD||pctDiff<=PCT_THRESHOLD) continue;

    // One-time large expense filter:
    // If a single transaction accounts for >60% of this month's category spend
    // AND its amount is > 3× the category average, flag it as one-time (not a trend)
    const catTxs=curr.filter(t=>t.type==='expense'&&t.cat===id);
    const maxSingle=catTxs.length?Math.max(...catTxs.map(t=>t.amt)):0;
    const isOneTimeSurge=(maxSingle/currAmt>0.6)&&(maxSingle>avg*3);
    if(isOneTimeSurge) continue;                     // skip one-time spikes

    alerts.push({id,cat:gc(id),currAmt,avg,absDiff,pctDiff:Math.round(pctDiff)});
  }
  alerts.sort((a,b)=>b.absDiff-a.absDiff);

  const totalCurr=sumExp(curr);
  const totalAvg=months3.map(sumExp).filter(v=>v>0);
  const totalAvgVal=totalAvg.length?totalAvg.reduce((s,v)=>s+v,0)/totalAvg.length:0;
  const totalDiff=totalCurr-totalAvgVal;
  const totalPct=totalAvgVal>0?Math.round((totalDiff/totalAvgVal)*100):0;

  return {alerts,totalCurr,totalAvgVal,totalDiff,totalPct};
}

function renderLeakCard(){
  const {alerts,totalCurr,totalAvgVal,totalDiff,totalPct}=detectLeaks();
  if(!totalAvgVal) return '';

  const isHealthy=alerts.length===0&&totalPct<=5;
  const isDanger=alerts.length>=2||totalPct>35;
  const cardClass=isHealthy?'healthy':isDanger?'danger':'warning';

  let headerHTML,itemsHTML='';
  if(isHealthy){
    headerHTML=`<div class="leak-icon" style="background:var(--green-light)">✅</div><div><div class="leak-title" style="color:var(--green)">Harcamalar sağlıklı görünüyor</div><div class="leak-sub">Son 3 aylık ortalamaya göre anormal artış yok</div></div>`;
  } else {
    const icon=isDanger?'🚨':'⚠️';
    headerHTML=`<div class="leak-icon" style="background:${isDanger?'var(--red-light)':'var(--amber-light)'}">${icon}</div><div><div class="leak-title" style="color:${isDanger?'var(--red)':'var(--amber)'}">${isDanger?'Önemli harcama artışları tespit edildi':'Bazı kategoriler artış gösteriyor'}</div><div class="leak-sub">3 aylık ortalamaya kıyasla</div></div>`;

    if(totalPct>15){
      itemsHTML+=`<div class="leak-item" style="background:rgba(255,107,107,.06)"><div class="leak-item-icon" style="background:var(--red-light)">📊</div><div class="leak-item-body"><div class="leak-item-name">Toplam harcama artışı</div><div class="leak-item-detail">${fmt(totalAvgVal)} ort. → ${fmt(totalCurr)} bu ay</div></div><div class="leak-item-delta" style="color:var(--red)">+${totalPct}%<br><span style="font-size:10px;color:var(--text3)">+${fmt(totalDiff)}</span></div></div>`;
    }

    alerts.slice(0,4).forEach(a=>{
      itemsHTML+=`<div class="leak-item"><div class="leak-item-icon" style="background:${a.cat.bg}">${a.cat.icon}</div><div class="leak-item-body"><div class="leak-item-name">${escapeHTML(a.cat.name)}</div><div class="leak-item-detail">${fmt(a.avg)} ort. → ${fmt(a.currAmt)}</div></div><div class="leak-item-delta" style="color:var(--red)">+${a.pctDiff}%<br><span style="font-size:10px;color:var(--text3)">+${fmt(a.absDiff)}</span></div></div>`;
    });
  }

  return `<div class="leak-card ${cardClass}"><div class="leak-header">${headerHTML}</div>${itemsHTML?`<div class="leak-items">${itemsHTML}</div>`:''}</div>`;
}

// AWARENESS ENGINE — correct financial math
// ═══════════════════════════════════════════════════
function buildAwareness(){
  const txs=txsFor(CY,CM);
  const inc=sumInc(txs), exp=sumExp(txs), net=inc-exp;

  const today=new Date();
  const dayOfMonth=today.getDate();
  const daysInMonth=new Date(CY,CM,0).getDate();
  // Month progress: percent of calendar days elapsed (use actual days)
  const monthPct=Math.round((dayOfMonth/daysInMonth)*100);

  // 1. Burn rate = total expenses / elapsed days (not projected)
  const burnRate=dayOfMonth>0?exp/dayOfMonth:0;

  // 2. Savings rate = (income - expenses) / income  [0 if no income]
  const savingsRate=inc>0?Math.round((net/inc)*100):0;

  // 3. Budget pace — uses month-snapshot budget
  const bgt=getBudgetForMonth(CY,CM);
  const totalBudget=Object.values(bgt).reduce((s,v)=>s+v,0);
  const budgetUsedPct=totalBudget>0?Math.round((exp/totalBudget)*100):null;
  // Pace OK if used% is within 10pp of month%
  const paceDelta=budgetUsedPct!==null?budgetUsedPct-monthPct:null;

  // 4. Runway — liquid accounts only (bank + cash, NOT invest or credit)
  // Proxy: income from bank/cash accounts minus expenses on bank/cash accounts this month
  // This is an approximation; true runway needs account balance tracking.
  const liquidInc = txs.filter(t=>t.type==='income'&&(t.account==='bank'||t.account==='cash')).reduce((s,t)=>s+t.amt,0);
  const liquidExp = txs.filter(t=>t.type==='expense'&&(t.account==='bank'||t.account==='cash')).reduce((s,t)=>s+t.amt,0);
  const liquidNet = liquidInc - liquidExp;
  const runway=(burnRate>0&&liquidNet>0)?Math.min(liquidNet/burnRate/30,60):null;

  // 5. Biggest expense
  const expTxs=txs.filter(t=>t.type==='expense');
  const biggestTx=expTxs.length?expTxs.reduce((a,b)=>b.amt>a.amt?b:a,expTxs[0]):null;

  // 6. Best/worst category vs budget (current month budget)
  const byCat={};
  expTxs.forEach(t=>{byCat[t.cat]=(byCat[t.cat]||0)+t.amt;});
  let worstCat=null,bestCat=null,worstOverBy=0,bestUnderBy=0;
  for(const [id,spent] of Object.entries(byCat)){
    const lim=bgt[id]||0; if(!lim) continue;
    const diff=spent-lim;
    if(diff>0&&diff>worstOverBy){worstOverBy=diff;worstCat={cat:gc(id),spent,lim,diff};}
    if(diff<0&&Math.abs(diff)>bestUnderBy){bestUnderBy=Math.abs(diff);bestCat={cat:gc(id),spent,lim,diff};}
  }

  // Remaining budget this month
  const remainingDays=daysInMonth-dayOfMonth;
  const remainingBudget=totalBudget-exp;
  const dailyBudgetLeft=remainingDays>0?remainingBudget/remainingDays:0;

  return {burnRate,savingsRate,budgetUsedPct,monthPct,paceDelta,runway,biggestTx,worstCat,bestCat,inc,exp,net,totalBudget,remainingBudget,remainingDays,dailyBudgetLeft,dayOfMonth,daysInMonth};
}

// ═══════════════════════════════════════════════════
// PREMIUM ANALYTICS ENGINE
// Patterns borrowed from PocketGuard (safe-to-spend), Copilot (recurring
// detection), Monarch (cash-flow forecast, net worth) and Wealthly (calendar).
// ═══════════════════════════════════════════════════

// Collapse a description to a merchant-ish key: lowercase, strip digits,
// punctuation and Turkish case quirks so "Migros 12" and "MIGROS" group together.
function normDesc(str){
  return String(str||'')
    .toLocaleLowerCase('tr')
    .replace(/[0-9]+/g,' ')
    .replace(/[^\p{L}\s]/gu,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function daysBetween(a,b){
  return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
}
function addDays(dstr,n){
  const d=new Date(dstr+'T12:00:00'); d.setDate(d.getDate()+n);
  return ds(d.getFullYear(),d.getMonth()+1,d.getDate());
}
function lastDayOf(y,m){ return new Date(y,m,0).getDate(); }

// ── Recurring due-dates ──────────────────────────────
// Scheduled dates for a template inside [from,to]. Used to price the bills that
// haven't landed yet, which is what makes "safe to spend" honest.
function recDatesInRange(tmpl,from,to){
  const out=[];
  if(tmpl.freq==='monthly'){
    let y=+from.slice(0,4), m=+from.slice(5,7);
    for(let i=0;i<14;i++){
      const dom=Math.min(tmpl.dayOfMonth||1,lastDayOf(y,m));
      const d=ds(y,m,dom);
      if(d>=from&&d<=to) out.push(d);
      if(d>to) break;
      m++; if(m>12){m=1;y++;}
    }
  } else {
    const step=tmpl.freq==='weekly'?7:1;
    let d=tmpl.startDate||from;
    if(d<from){
      const gap=daysBetween(d,from);
      d=addDays(d,Math.ceil(gap/step)*step);
    }
    let guard=0;
    while(d<=to&&guard++<400){ out.push(d); d=addDays(d,step); }
  }
  return out;
}

// Expense templates still due between today and month end.
function upcomingBills(y,m){
  const today=todayStr();
  const last=ds(y,m,lastDayOf(y,m));
  if(last<today) return {total:0,items:[]};
  let total=0; const items=[];
  REC_TEMPLATES.filter(r=>r.active&&r.type==='expense').forEach(r=>{
    const done=new Set(TXS.filter(t=>t.recurringId===r.id).map(t=>t.date));
    const cap=r.occurrences>0?r.occurrences:Infinity;
    let made=TXS.filter(t=>t.recurringId===r.id).length;
    recDatesInRange(r,today,last).forEach(d=>{
      if(d<=today||done.has(d)||made>=cap) return;
      made++; total+=r.amt; items.push({tmpl:r,date:d});
    });
  });
  items.sort((a,b)=>a.date.localeCompare(b.date));
  return {total,items};
}

// ── Safe to spend (PocketGuard "In My Pocket") ───────
// What's genuinely free to spend: money in, minus what's already gone, minus
// the bills you know are still coming.
function safeToSpend(y,m){
  const txs=txsFor(y,m);
  const inc=sumInc(txs), exp=sumExp(txs);
  const bills=upcomingBills(y,m);
  const left=inc-exp-bills.total;
  const isCurrent=(y===CY&&m===CM);
  const daysLeft=isCurrent?Math.max(lastDayOf(y,m)-new Date().getDate(),0):0;
  return {
    left, inc, exp,
    bills:bills.total, billItems:bills.items,
    daysLeft,
    perDay:daysLeft>0?left/daysLeft:left,
    isCurrent
  };
}

// ── Month-end forecast (Monarch cash-flow) ───────────
// Straight run-rate on elapsed days, plus the bills we already know about.
function monthForecast(y,m){
  const txs=txsFor(y,m);
  const exp=sumExp(txs);
  const dim=lastDayOf(y,m);
  const isCurrent=(y===CY&&m===CM);
  if(!isCurrent) return {projected:exp,exp,dim,dayOfMonth:dim,isCurrent:false,budget:0,overBy:0};
  const day=new Date().getDate();
  const bills=upcomingBills(y,m).total;
  // Variable spend keeps running at today's pace; known bills are added on top.
  const variable=exp-txsFor(y,m).filter(t=>t.type==='expense'&&t.recurringId).reduce((s,t)=>s+t.amt,0);
  const projected=exp+(day>0?(variable/day)*(dim-day):0)+bills;
  const bgt=getBudgetForMonth(y,m);
  const budget=Object.values(bgt).reduce((s,v)=>s+v,0);
  return {projected,exp,dim,dayOfMonth:day,isCurrent:true,budget,overBy:budget>0?projected-budget:0};
}

// ── Subscription detection (Copilot / Rocket Money) ──
// Look for the same payee recurring on a steady cadence at a steady price.
// Anything already attached to a template is skipped.
function detectSubscriptions(){
  const groups={};
  TXS.filter(t=>t.type==='expense'&&!t.recurringId).forEach(t=>{
    const k=normDesc(t.desc);
    if(k.length<3) return;
    (groups[k]=groups[k]||[]).push(t);
  });
  const known=new Set(REC_TEMPLATES.map(r=>normDesc(r.desc)));
  const out=[];
  Object.entries(groups).forEach(([key,list])=>{
    if(list.length<3||known.has(key)||DISMISSED_SUBS.includes(key)) return;
    list.sort((a,b)=>a.date.localeCompare(b.date));
    const gaps=[];
    for(let i=1;i<list.length;i++) gaps.push(daysBetween(list[i-1].date,list[i].date));
    const avgGap=gaps.reduce((a,b)=>a+b,0)/gaps.length;
    const freq = (avgGap>=24&&avgGap<=38)?'monthly'
               : (avgGap>=5&&avgGap<=9)?'weekly' : null;
    if(!freq) return;
    // Cadence must be consistent, not just right on average.
    if(gaps.some(g=>Math.abs(g-avgGap)>avgGap*0.45)) return;
    const amts=list.map(t=>t.amt);
    const avgAmt=amts.reduce((a,b)=>a+b,0)/amts.length;
    if(avgAmt<=0) return;
    if((Math.max(...amts)-Math.min(...amts))/avgAmt>0.35) return;
    const last=list[list.length-1];
    out.push({key,list,count:list.length,avgAmt,freq,last,
              yearly:avgAmt*(freq==='monthly'?12:52)});
  });
  return out.sort((a,b)=>b.yearly-a.yearly);
}

// ── Daily spend, for the calendar heatmap (Wealthly) ─
function dailySpend(y,m){
  const map={};
  TXS.filter(t=>t.type==='expense'&&t.date.startsWith(mStr(y,m)))
     .forEach(t=>{ const d=+t.date.slice(8,10); map[d]=(map[d]||0)+t.amt; });
  return map;
}

// ── Top merchants, with change vs the previous month ─
function topMerchants(y,m,n){
  let pm=m-1,py=y; if(pm<1){pm=12;py--;}
  const roll=(yy,mm)=>{
    const acc={};
    TXS.filter(t=>t.type==='expense'&&t.date.startsWith(mStr(yy,mm))).forEach(t=>{
      const k=normDesc(t.desc)||'(adsız)';
      if(!acc[k]) acc[k]={key:k,label:t.desc||'(adsız)',amt:0,count:0,cat:t.cat};
      acc[k].amt+=t.amt; acc[k].count++;
    });
    return acc;
  };
  const cur=roll(y,m), prev=roll(py,pm);
  return Object.values(cur)
    .map(o=>({...o, prev:prev[o.key]?prev[o.key].amt:0}))
    .sort((a,b)=>b.amt-a.amt)
    .slice(0,n||6);
}

// ── Net worth over time (Monarch / Copilot) ──────────
// Starting balances plus every transaction up to the end of each month.
function netWorthSeries(n,endY,endM){
  const base=Object.values(ACCOUNT_INIT_BALANCES).reduce((s,v)=>s+(+v||0),0);
  const out=[];
  for(let i=n-1;i>=0;i--){
    let m=endM-i,y=endY; while(m<1){m+=12;y--;}
    const end=ds(y,m,lastDayOf(y,m));
    const net=TXS.filter(t=>t.date<=end)
                 .reduce((s,t)=>s+(t.type==='income'?t.amt:-t.amt),0);
    out.push({y,m,label:mShort(m),val:base+net});
  }
  return out;
}

    const pc=a.paceDelta<=5?'green':a.paceDelta<=15?'amber':'red';

  }

  // Runway
  if(a.runway!==null){
    const rc=a.runway>=3?'green':a.runway>=1?'amber':'red';
    cards.push(`<div class="aw-card ${rc}"><span class="aw-icon">⛽</span><div class="aw-val" style="color:var(--${rc})">${a.runway.toFixed(1)}<span style="font-size:13px"> ay</span></div><div class="aw-label">Tasarruf Süresi</div><div class="aw-sub">Mevcut harcama hızında</div></div>`);

  if(a.remainingDays>0&&a.totalBudget>0){
    const rbc=a.dailyBudgetLeft>=a.burnRate?'green':a.dailyBudgetLeft>=a.burnRate*0.5?'amber':'red';
    cards.push(`<div class="aw-card ${rbc}"><span class="aw-icon">📅</span><div class="aw-val" style="color:var(--${rbc})">${fmt(a.dailyBudgetLeft)}<span style="font-size:12px">/gün</span></div><div class="aw-label">Kalan Günlük Bütçe</div><div class="aw-sub">${a.remainingDays} gün kaldı · ${fmt(a.remainingBudget)} toplam</div></div>`);
  }

  // Biggest expense
  if(a.biggestTx){
    const c=gc(a.biggestTx.cat);
    cards.push(`<div class="aw-card red"><span class="aw-icon">${c.icon}</span><div class="aw-val" style="color:var(--red);font-size:18px">${fmt(a.biggestTx.amt)}</div><div class="aw-label">En Büyük Gider</div><div class="aw-sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHTML(a.biggestTx.desc)}</div></div>`);
  }

  // Worst category
  if(a.worstCat){
    cards.push(`<div class="aw-card red"><span class="aw-icon">${a.worstCat.cat.icon}</span><div class="aw-val" style="color:var(--red);font-size:18px">+${fmt(a.worstCat.diff)}</div><div class="aw-label">Bütçe Aşımı</div><div class="aw-sub">${escapeHTML(a.worstCat.cat.name)}: ${fmt(a.worstCat.spent)} / ${fmt(a.worstCat.lim)}</div></div>`);
  }

  // Best category
  if(a.bestCat){
    cards.push(`<div class="aw-card green"><span class="aw-icon">${a.bestCat.cat.icon}</span><div class="aw-val" style="color:var(--green);font-size:18px">${fmt(Math.abs(a.bestCat.diff))}</div><div class="aw-label">Tasarruflu Kategori</div><div class="aw-sub">${escapeHTML(a.bestCat.cat.name)}: ${fmt(a.bestCat.spent)} / ${fmt(a.bestCat.lim)}</div></div>`);
  }

  if(!cards.length) return '';
  return `<div class="awareness-grid">${cards.join('')}</div>`;
}

// ═══════════════════════════════════════════════════
// TRANSACTIONS
// ═══════════════════════════════════════════════════
function applyFilters(txs){
  return txs.filter(t=>{
    if(!t.date.startsWith(mStr(vmY,vmM))) return false;
    if(fType!=='all'&&t.type!==fType) return false;
    if(fCat!=='all'&&t.cat!==fCat) return false;
    if(fAccount!=='all'&&t.account!==fAccount) return false;
    if(fSearch){const q=fSearch.toLowerCase();if(![t.desc,t.sub,t.note].some(s=>s&&s.toLowerCase().includes(q)))return false;}
    if(fAmtMin!==''){ const mn=parseFloat(fAmtMin); if(Number.isFinite(mn)&&t.amt<mn) return false; }
    if(fAmtMax!==''){ const mx=parseFloat(fAmtMax); if(Number.isFinite(mx)&&t.amt>mx) return false; }
    if(fDateFrom&&t.date<fDateFrom) return false;
    if(fDateTo&&t.date>fDateTo) return false;
    return true;
  });
}
function hasActiveFilters(){return fType!=='all'||fCat!=='all'||fAccount!=='all'||fAmtMin!==''||fAmtMax!==''||fDateFrom!==''||fDateTo!=='';}
function clearAllFilters(){fType='all';fCat='all';fAccount='all';fAmtMin='';fAmtMax='';fDateFrom='';fDateTo='';fSearch='';renderTx();}

function renderTx(){
  const filtered=applyFilters(TXS);
  const inc=sumInc(filtered),exp=sumExp(filtered),net=inc-exp;
  const usedCats=[...new Set(txsFor(vmY,vmM).map(t=>t.cat))];
  const activeFilters=hasActiveFilters();

  let catChips=`<div class="chip ${fCat==='all'?'on':'off'}" onclick="setCF('all')">Tümü</div>`;
  usedCats.forEach(cid=>{const c=gc(cid);catChips+=`<div class="chip ${fCat===cid?'on':'off'}" onclick="setCF('${cid}')">${c.icon} ${escapeHTML(c.name)}</div>`;});

  const el=document.getElementById('pg-tx');
  el.innerHTML=`
    <div class="pg-hdr"><div class="pg-title">İşlemler</div>
      <div class="pg-actions">
        <button class="icon-btn ${selectMode?'active-filter':''}" onclick="${selectMode?'exitSelectMode()':'enterSelectMode()'}" title="${selectMode?'Seçimi İptal':'Çoklu Seç'}" style="font-size:13px;font-weight:800">${selectMode?'✕':'☑'}</button>
        <button class="icon-btn ${activeFilters||filterOpen?'active-filter':''}" onclick="toggleFilterPanel()">⚡</button>
        <button class="icon-btn" onclick="exportCSV()">⬇</button>
      </div>
    </div>
    <div class="mnav">
      <button class="mnav-btn" onclick="chVM(-1)">‹</button>
      <div class="mnav-label">${mName(vmM)} ${vmY}</div>
      <button class="mnav-btn" onclick="chVM(1)">›</button>
    </div>
    <div class="stat-strip">
      <div class="scard"><div class="scard-label">Gelir</div><div class="scard-val" style="color:var(--green)">${fmt(inc)}</div></div>
      <div class="scard"><div class="scard-label">Gider</div><div class="scard-val" style="color:var(--red)">${fmt(exp)}</div></div>
      <div class="scard"><div class="scard-label">Net</div><div class="scard-val" style="color:${net>=0?'var(--green)':'var(--red)'}">${net>=0?'+':''}${fmt(net)}</div></div>
      <div class="scard"><div class="scard-label">Adet</div><div class="scard-val">${filtered.length}</div></div>
    </div>
    <div class="filter-panel ${filterOpen?'open':''}" id="filter-panel">
      <div class="fp-row">
        <div><div class="fp-label">Min Tutar</div><input class="fp-input" id="fp-amt-min" type="number" placeholder="₺0" value="${fAmtMin}" oninput="fAmtMin=this.value;renderTxKeepFocus()"/></div>
        <div><div class="fp-label">Max Tutar</div><input class="fp-input" id="fp-amt-max" type="number" placeholder="Hepsi" value="${fAmtMax}" oninput="fAmtMax=this.value;renderTxKeepFocus()"/></div>
      </div>
      <div class="fp-row">
        <div><div class="fp-label">Başlangıç</div><input class="fp-input" id="fp-date-from" type="date" value="${fDateFrom}" oninput="fDateFrom=this.value;renderTxKeepFocus()"/></div>
        <div><div class="fp-label">Bitiş</div><input class="fp-input" id="fp-date-to" type="date" value="${fDateTo}" oninput="fDateTo=this.value;renderTxKeepFocus()"/></div>
      </div>
      <div class="fp-row">
        <div><div class="fp-label">Hesap</div>
          <select class="fp-input fp-select" onchange="fAccount=this.value;renderTx()">
            <option value="all" ${fAccount==='all'?'selected':''}>Tüm Hesaplar</option>
            ${Object.entries(ACCOUNTS).map(([k,v])=>`<option value="${k}" ${fAccount===k?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;align-items:flex-end"><button class="fp-clear" onclick="clearAllFilters()">✕ Temizle</button></div>
      </div>
    </div>
    <div class="search-wrap"><input class="search-input" id="tx-search" placeholder="Açıklama, kategori veya not ara…" value="${escapeHTML(fSearch)}" oninput="setSF(this.value)"/></div>
    <div class="filter-bar">
      <div class="chip ${fType==='all'?'on':'off'}" onclick="setTF('all')">Tümü</div>
      <div class="chip ${fType==='expense'?'on':'off'}" onclick="setTF('expense')">↑ Giderler</div>
      <div class="chip ${fType==='income'?'on':'off'}" onclick="setTF('income')">↓ Gelirler</div>
    </div>
    <div class="filter-bar" style="margin-bottom:10px">${catChips}</div>
    ${filtered.length?renderTxGroups(filtered):`
      <div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Sonuç bulunamadı</div><div class="empty-msg">Filtrelerinizi ayarlayın.</div>
      ${activeFilters?`<button class="empty-btn" onclick="clearAllFilters()">Filtreleri Temizle</button>`:''}</div>`}
    <div style="height:8px"></div>`;
  attachTxHandlers(el);
}

function toggleFilterPanel(){filterOpen=!filterOpen;renderTx();}
function chVM(d){vmM+=d;if(vmM>12){vmM=1;vmY++;}if(vmM<1){vmM=12;vmY--;}renderTx();}
function setTF(v){fType=v;renderTx();}function setCF(v){fCat=v;renderTx();}
function setSF(v){fSearch=v;renderTxKeepFocus();}
// renderTx() replaces the page's innerHTML, which blows away the focused field.
// Remember which input had focus (and the caret) and restore it afterwards.
function renderTxKeepFocus(){
  const a=document.activeElement;
  const id=a&&a.id?a.id:null;
  let pos=null; try{ pos=a?a.selectionStart:null; }catch(e){}
  renderTx();
  if(!id) return;
  const n=document.getElementById(id);
  if(!n) return;
  n.focus();
  try{ if(pos!=null) n.setSelectionRange(pos,pos); }catch(e){}
}

// STATS
// ═══════════════════════════════════════════════════
function renderStats(){
  const txs=txsFor(smY,smM),inc=sumInc(txs),exp=sumExp(txs),net=inc-exp;
  const sr=inc>0?Math.round((net/inc)*100):0;
  let pm2=smM-1,py2=smY;if(pm2<1){pm2=12;py2--;}
  const ptxs=txsFor(py2,pm2),pinc=sumInc(ptxs),pexp=sumExp(ptxs);
  const expDelta=pexp>0?((exp-pexp)/pexp*100).toFixed(0):null;
  const incDelta=pinc>0?((inc-pinc)/pinc*100).toFixed(0):null;
  const srPrev=pinc>0?Math.round(((pinc-pexp)/pinc)*100):0;

  const byCat={};
  txs.filter(t=>t.type==='expense').forEach(t=>{byCat[t.cat]=(byCat[t.cat]||0)+t.amt;});
  const catItems=Object.entries(byCat).map(([id,amt])=>({id,amt,cat:gc(id),pct:exp>0?Math.round(amt/exp*100):0})).sort((a,b)=>b.amt-a.amt);

  const allExpTxs=txs.filter(t=>t.type==='expense');
  const biggestTx=allExpTxs.length?allExpTxs.reduce((a,b)=>b.amt>a.amt?b:a,allExpTxs[0]):null;
  const daysInMonth=new Date(smY,smM,0).getDate();
  const daysPassed=smM===CM&&smY===CY?new Date().getDate():daysInMonth;
  const avgDaily=daysPassed>0?exp/daysPassed:0;
  const topCat=catItems[0];
  const srDelta=sr-srPrev;

  let donutSVG='';
  if(catItems.length&&exp>0){
    const r=52,cx=65,cy=65,sw=18,circ=2*Math.PI*r;let off=0,segs='';
    catItems.forEach(it=>{const dash=(it.amt/exp)*circ;segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.cat.color}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round"/>`;off+=dash;});
    donutSVG=`<svg width="130" height="130" style="flex-shrink:0;overflow:visible"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${sw}"/>${segs}<text x="${cx}" y="${cy-7}" text-anchor="middle" font-size="10" fill="var(--text3)" font-family="Geist,sans-serif" font-weight="700" letter-spacing="1">GİDER</text><text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="15" fill="var(--text)" font-family="Geist,sans-serif" font-weight="900">${fmt(exp)}</text></svg>`;
  }
  const legendHTML=catItems.slice(0,6).map(it=>`<div class="dl-item" style="cursor:pointer" onclick="showCatTxSheet('${it.id}',${smY},${smM})"><div class="dl-dot" style="background:${it.cat.color}"></div><div class="dl-name">${it.cat.icon} ${escapeHTML(it.cat.name)}</div><div class="dl-right"><div class="dl-pct" style="color:${it.cat.color}">%${it.pct}</div><div class="dl-amt">${fmt(it.amt)}</div></div></div>`).join('');

  const trend=[];
  for(let i=5;i>=0;i--){let m=smM-i,y=smY;if(m<1){m+=12;y--;}const mt=txsFor(y,m);trend.push({label:mShort(m),inc:sumInc(mt),exp:sumExp(mt),cur:(m===smM&&y===smY)});}
  const maxV=Math.max(...trend.map(d=>Math.max(d.inc,d.exp)),1);
  const bw=36,bgap=8,h=100;
  const bars=trend.map((d,i)=>{const x=i*(bw+bgap),ih=Math.max(Math.round(d.inc/maxV*h),d.inc>0?3:0),eh=Math.max(Math.round(d.exp/maxV*h),d.exp>0?3:0),op=d.cur?1:.5;return `<g><rect x="${x}" y="${h-ih}" width="${bw/2-2}" height="${ih}" rx="3" fill="var(--green)" opacity="${op}"/><rect x="${x+bw/2+1}" y="${h-eh}" width="${bw/2-2}" height="${eh}" rx="3" fill="var(--red)" opacity="${op}"/></g>`;}).join('');
  const svgW=(bw+bgap)*6-bgap;
  const trendLabels=trend.map(d=>`<div class="trend-label" style="width:${bw}px;text-align:center;${d.cur?'color:var(--text);font-weight:800':''}">${d.label}</div>`).join('');

  // Use budget snapshot for selected month
  const bgtSnap=getBudgetForMonth(smY,smM);
  const catRows=catItems.map(it=>{const bgt=bgtSnap[it.id]||0,over=bgt>0&&it.amt>bgt,pct=bgt>0?Math.min(it.amt/bgt*100,100):0;return `<div class="cat-spend-item" style="cursor:pointer" onclick="showCatTxSheet('${it.id}',${smY},${smM})"><div class="csi-icon" style="background:${it.cat.bg}">${it.cat.icon}</div><div class="csi-body"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div><div class="csi-name">${escapeHTML(it.cat.name)}</div><div style="font-size:10px;font-weight:700;color:var(--text3)">%${it.pct} harcama</div></div><div class="csi-right"><div class="csi-amt">−${fmt(it.amt)}</div>${bgt>0?`<div class="csi-bgt">/ ${fmt(bgt)}</div>`:''}<div style="font-size:10px;color:var(--text3);margin-top:3px">›</div></div></div>${bgt>0?`<div class="prog-track"><div class="prog-bar" style="width:${pct}%;background:${over?'var(--red)':it.cat.color}"></div></div>`:''}</div></div>`;}).join('');

  // ── Calendar heatmap (Wealthly / CalendarBudget) ────
  const spendMap=dailySpend(smY,smM);
  const dim=lastDayOf(smY,smM);
  const maxDay=Math.max(...Object.values(spendMap),0);
  // Monday-first grid, matching the Turkish calendar convention.
  const firstDow=(new Date(smY,smM-1,1).getDay()+6)%7;
  const todayD=(smY===CY&&smM===CM)?new Date().getDate():-1;
  let cells='';
  for(let d=1;d<=dim;d++){
    const amt=spendMap[d]||0;
    const ratio=maxDay>0?amt/maxDay:0;
    // Four buckets read more clearly than a continuous ramp at this size.
    const lvl=amt===0?0:ratio>0.66?3:ratio>0.33?2:1;
    cells+=`<div class="cal-cell lvl${lvl}${d===todayD?' today':''}" ${d===1?`style="grid-column-start:${firstDow+1}"`:''} ${amt>0?`onclick="showDaySheet('${ds(smY,smM,d)}')"`:''} title="${amt>0?fmt(amt):'harcama yok'}">
      <span class="cal-d">${d}</span>${amt>0?`<span class="cal-a">${Math.round(amt/1000)>0?Math.round(amt/1000)+'B':'‹1B'}</span>`:''}
    </div>`;
  }
  const busiest=Object.entries(spendMap).sort((a,b)=>b[1]-a[1])[0];
  const calHTML=`<div style="padding:0 14px;margin-bottom:14px"><div class="card" style="padding:18px">
    <div class="an-hdr">Harcama Takvimi<span class="an-hdr-sub">${busiest?`En yoğun: ${busiest[0]} ${mShort(smM)} · ${fmt(busiest[1])}`:'veri yok'}</span></div>

    <div class="cal-grid">${cells}</div>
    <div class="cal-legend"><span>Az</span><i class="lvl0"></i><i class="lvl1"></i><i class="lvl2"></i><i class="lvl3"></i><span>Çok</span></div>
  </div></div>`;

  // ── Top merchants (MoneyPatrol-style payee analysis) ─
  const merch=topMerchants(smY,smM,6);
  const merchHTML=merch.length?`<div style="padding:0 14px;margin-bottom:14px"><div class="card" style="padding:18px">
    <div class="an-hdr">En Çok Harcadığın Yerler<span class="an-hdr-sub">${mName(smM)}</span></div>
    ${merch.map(mo=>{
      const d=mo.prev>0?Math.round((mo.amt-mo.prev)/mo.prev*100):null;
      const mc=gc(mo.cat);
      return `<div class="mer-row">
        <div class="mer-icon" style="background:${mc.bg}">${mc.icon}</div>
        <div class="mer-body">
          <div class="mer-name">${escapeHTML(mo.label)}</div>
          <div class="mer-meta">${mo.count} işlem${mo.prev>0?` · geçen ay ${fmt(mo.prev)}`:' · ilk kez'}</div>
        </div>
        <div class="mer-right">
          <div class="mer-amt">${fmt(mo.amt)}</div>
          ${d!==null&&d!==0?`<div class="mer-d" style="color:${d>0?'var(--red)':'var(--green)'}">${d>0?'↑':'↓'}%${Math.abs(d)}</div>`:''}
        </div>
      </div>`;
    }).join('')}
  </div></div>`:'';

  // ── Net worth trend (Monarch / Copilot) ─────────────
  const nw=netWorthSeries(6,smY,smM);
  const nwMin=Math.min(...nw.map(o=>o.val)), nwMax=Math.max(...nw.map(o=>o.val));
  const nwRange=(nwMax-nwMin)||1;
  const nwW=300, nwH=70;
  const nwPts=nw.map((o,i)=>{
    const x=(i/(nw.length-1||1))*nwW;
    const y=nwH-((o.val-nwMin)/nwRange)*nwH;
    return [x,y];
  });
  const nwLine=nwPts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
  const nwArea=`${nwLine} L${nwW} ${nwH} L0 ${nwH} Z`;
  const nwNow=nw[nw.length-1].val, nwThen=nw[0].val;
  const nwDelta=nwNow-nwThen;
  const nwHTML=`<div style="padding:0 14px;margin-bottom:14px"><div class="card" style="padding:18px">
    <div class="an-hdr">Net Varlık<span class="an-hdr-sub">son 6 ay</span></div>
    <div class="nw-val">${nwNow<0?'−':''}${fmt(nwNow)}</div>
    <div class="nw-delta" style="color:${nwDelta>=0?'var(--green)':'var(--red)'}">${nwDelta>=0?'↑':'↓'} ${fmt(nwDelta)} bu dönemde</div>
    <svg viewBox="0 0 ${nwW} ${nwH}" preserveAspectRatio="none" class="nw-svg">
      <defs><linearGradient id="nwg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--green)" stop-opacity=".28"/>

      </linearGradient></defs>

  const el=document.getElementById('pg-stats');
  el.innerHTML=`

      <div class="mnav-label">${mName(smM)} ${smY}</div>

      <div class="scard"><div class="scard-label">Gider</div><div class="scard-val" style="color:var(--red)">${fmt(exp)}</div>${expDelta!==null?`<div class="scard-delta" style="color:${expDelta<=0?'var(--green)':'var(--red)'};">${expDelta>=0?'↑':'↓'} %${Math.abs(expDelta)}</div>`:''}</div>
      <div class="scard"><div class="scard-label">Net</div><div class="scard-val" style="color:${net>=0?'var(--green)':'var(--red)'}">${net>=0?'+':''}${fmt(net)}</div></div>
      <div class="scard"><div class="scard-label">Oran</div><div class="scard-val" style="color:${sr>=20?'var(--green)':sr>=0?'var(--amber)':'var(--red)'}">%${sr}</div>${srPrev?`<div class="scard-delta" style="color:var(--text3)">geçen: %${srPrev}</div>`:''}</div>
    </div>
    <div class="insight-row">
      ${topCat?`<div class="insight-card"><div class="ic-icon" style="background:${topCat.cat.bg}">${topCat.cat.icon}</div><div class="ic-val" style="color:${topCat.cat.color}">${fmt(topCat.amt)}</div><div class="ic-label">En yüksek kategori</div><div class="ic-delta">${escapeHTML(topCat.cat.name)} · %${topCat.pct}</div></div>`:''}
      ${biggestTx?`<div class="insight-card"><div class="ic-icon" style="background:var(--red-light)">💸</div><div class="ic-val" style="color:var(--red)">${fmt(biggestTx.amt)}</div><div class="ic-label">En büyük gider</div><div class="ic-delta">${escapeHTML(biggestTx.desc)}</div></div>`:''}

// CATEGORY DETAIL — month-by-month comparison + drill-down
// ═══════════════════════════════════════════════════
let catSheetId=null, catSheetY=null, catSheetM=null, catSheetSpan=6;

// Spend for one category in one month. Sub-category filter is optional.
function catMonthTotal(catId,y,m,sub){
  const key=mStr(y,m);
  return TXS.filter(t=>t.type==='expense'&&t.cat===catId&&t.date.startsWith(key)&&(!sub||t.sub===sub))
            .reduce((s,t)=>s+t.amt,0);
}
// Walk back `n` months from (endY,endM) inclusive, oldest first.
function catMonthlySeries(catId,endY,endM,n,sub){
  const out=[];
  for(let i=n-1;i>=0;i--){
    let m=endM-i,y=endY;
    while(m<1){m+=12;y--;}
    out.push({y,m,label:mShort(m),amt:catMonthTotal(catId,y,m,sub)});
  }
  return out;
}

function showCatTxSheet(catId,y,m){
  catSheetId=catId;
  catSheetY=(y!=null?y:smY);
  catSheetM=(m!=null?m:smM);
  renderCatSheet();
  document.getElementById('cat-tx-overlay').classList.add('open');
}
function setCatSheetMonth(y,m){ catSheetY=y; catSheetM=m; renderCatSheet(); }
function setCatSheetSpan(n){ catSheetSpan=n; renderCatSheet(); }
function chCatSheetMonth(d){
  let m=catSheetM+d,y=catSheetY;
  if(m>12){m=1;y++;} if(m<1){m=12;y--;}
  setCatSheetMonth(y,m);
}

function renderCatSheet(){
  const catId=catSheetId, y=catSheetY, m=catSheetM;
  const cat=gc(catId);
  const series=catMonthlySeries(catId,y,m,catSheetSpan);
  const cur=series[series.length-1].amt;
  const prev=series.length>1?series[series.length-2].amt:0;

  // Average over previous months only — including the current (possibly partial)
  // month would drag the baseline toward itself and hide the comparison.
  const past=series.slice(0,-1);
  const spent=past.filter(p=>p.amt>0);
  const avg=spent.length?spent.reduce((s,p)=>s+p.amt,0)/spent.length:0;
  const peak=series.reduce((a,b)=>b.amt>a.amt?b:a,series[0]);
  const maxV=Math.max(...series.map(s=>s.amt),1);

  const pctOf=(a,b)=>b>0?Math.round((a-b)/b*100):null;
  const dPrev=pctOf(cur,prev), dAvg=pctOf(cur,avg);
  const arrow=v=>v>0?'↑':v<0?'↓':'→';
  const tone=v=>v>0?'var(--red)':v<0?'var(--green)':'var(--text3)';

  document.getElementById('cat-tx-title').innerHTML=
    `<span style="margin-right:9px">${cat.icon}</span>${escapeHTML(cat.name)}`;

  // ── month bars ───────────────────────────────────
  const bars=series.map(s=>{
    const sel=(s.y===y&&s.m===m);
    const hPct=Math.max(Math.round(s.amt/maxV*100),s.amt>0?4:1.5);
    return `<button class="cmp-bar-col${sel?' sel':''}" onclick="setCatSheetMonth(${s.y},${s.m})" aria-label="${s.label} ${s.y}">
      <div class="cmp-bar-val">${s.amt>0?fmt(s.amt).replace('₺',''):'–'}</div>
      <div class="cmp-bar-track"><div class="cmp-bar-fill" style="height:${hPct}%;background:${sel?cat.color:'var(--border2)'}"></div></div>
      <div class="cmp-bar-lbl">${s.label}</div>
    </button>`;
  }).join('');

  const spanBtn=(n,txt)=>`<button class="cmp-span${catSheetSpan===n?' on':''}" onclick="setCatSheetSpan(${n})">${txt}</button>`;

  // ── sub-category breakdown for the selected month ─
  const monthTxs=TXS.filter(t=>t.type==='expense'&&t.cat===catId&&t.date.startsWith(mStr(y,m)))
                    .sort((a,b)=>b.date.localeCompare(a.date)||b.amt-a.amt);
  const bySub={};
  monthTxs.forEach(t=>{const k=t.sub||'Diğer';bySub[k]=(bySub[k]||0)+t.amt;});
  const subRows=Object.entries(bySub).sort((a,b)=>b[1]-a[1]).map(([name,amt])=>{
    const prevAmt=catMonthTotal(catId,series.length>1?series[series.length-2].y:y,series.length>1?series[series.length-2].m:m,name);
    const d=pctOf(amt,prevAmt);
    return `<div class="cmp-sub">
      <div class="cmp-sub-bar" style="width:${cur>0?Math.round(amt/cur*100):0}%;background:${cat.color}1F"></div>
      <div class="cmp-sub-name">${escapeHTML(name)}</div>
      <div class="cmp-sub-right">
        <div class="cmp-sub-amt">${fmt(amt)}</div>
        ${d!==null&&d!==0?`<div class="cmp-sub-d" style="color:${tone(d)}">${arrow(d)}%${Math.abs(d)}</div>`:''}
      </div>
    </div>`;
  }).join('');

  const rows=monthTxs.map(tx=>`<div class="tx-item" style="margin:0 0 6px;cursor:pointer" onclick="S.open('${tx.id}');closeCatTxSheet()">
      <div class="tx-icon" style="background:${cat.bg}">${cat.icon}</div>
      <div class="tx-body">
        <div class="tx-name">${escapeHTML(tx.desc||tx.sub||cat.name)}</div>
        <div class="tx-meta">${fmtD(tx.date)}${tx.sub?`<span class="tx-meta-dot"></span>${escapeHTML(tx.sub)}`:''}${tx.note?`<span class="tx-meta-dot"></span>${escapeHTML(tx.note)}`:''}${tx.recurring?'<span class="tx-meta-dot"></span>↻':''}</div>
      </div>
      <div class="tx-amount exp">−${fmt(tx.amt)}</div>
    </div>`).join('');

  document.getElementById('cat-tx-body').innerHTML=`
    <div class="cmp-spans">${spanBtn(6,'6 ay')}${spanBtn(12,'12 ay')}${spanBtn(24,'24 ay')}</div>
    <div class="cmp-chart${catSheetSpan>12?' dense':''}">${bars}</div>

    <div class="cmp-stats">
      <div class="cmp-stat">
        <div class="cmp-lbl">${mShort(m)} ${y}</div>
        <div class="cmp-val" style="color:var(--text)">${fmt(cur)}</div>
      </div>
      <div class="cmp-stat">
        <div class="cmp-lbl">Önceki ay</div>
        <div class="cmp-val">${prev>0?fmt(prev):'–'}</div>
        ${dPrev!==null?`<div class="cmp-delta" style="color:${tone(dPrev)}">${arrow(dPrev)} %${Math.abs(dPrev)}</div>`:''}
      </div>
      <div class="cmp-stat">
        <div class="cmp-lbl">${catSheetSpan} ay ort.</div>
        <div class="cmp-val">${avg>0?fmt(avg):'–'}</div>
        ${dAvg!==null?`<div class="cmp-delta" style="color:${tone(dAvg)}">${arrow(dAvg)} %${Math.abs(dAvg)}</div>`:''}
      </div>
    </div>

    ${peak.amt>0?`<div class="cmp-note">📈 En yüksek: <b>${mName(peak.m)} ${peak.y}</b> · ${fmt(peak.amt)}${avg>0?` &nbsp;·&nbsp; Ortalamanın ${cur>avg?'üstünde':'altında'}sin`:''}</div>`:''}

    ${subRows?`<div class="cmp-head">Alt kırılım · ${mName(m)}</div><div class="cmp-subs">${subRows}</div>`:''}

    <div class="cmp-head">
      İşlemler · ${mName(m)} ${y}
      <span style="font-weight:600;color:var(--text3)">${monthTxs.length} kayıt</span>
    </div>
    ${rows||`<div class="empty" style="padding:28px 20px 34px"><div class="empty-icon">🗓</div><div class="empty-title">Bu ay bu kategoride harcama yok</div><div class="empty-msg">Yukarıdaki aylardan birine dokunarak gezinebilirsin.</div></div>`}
    <div style="height:8px"></div>`;
}

// ── Convert a detected subscription into a real recurring template ──
async function adoptSubscription(key){
  const sub=detectSubscriptions().find(x=>x.key===key);
  if(!sub){ toast('Öneri artık geçerli değil','warn'); return; }
  const ok=await askChoice({
    title:'Düzenli işlem olarak ekle',
    msg:`"${sub.last.desc}" son ${sub.count} ayda düzenli olarak ${fmt(sub.avgAmt)} tutarında görünüyor. Şablon olarak eklenirse ileri tarihli kayıtlar otomatik oluşturulur.`,
    choices:[{label:'Şablon oluştur',value:'go',hint:`${sub.freq==='monthly'?'Aylık':'Haftalık'} · ${fmt(sub.avgAmt)}`,tone:'primary'}]
  });
  if(ok!=='go') return;
  const t=sub.last;
  const rid=gid();
  // Attach the most recent occurrence to the new series so the generator
  // continues from it instead of duplicating this month.
  TXS=TXS.map(x=>x.id===t.id?{...x,recurring:true,recurringId:rid,freq:sub.freq,occurrences:0}:x);
  upsertTemplate({...t,amt:Math.round(sub.avgAmt),recurring:true,recurringId:rid,freq:sub.freq,occurrences:0});
  saveTxs(); processRecurring(); saveTxs();
  toast('Düzenli işlem oluşturuldu');
  renderRec();
}
function dismissSubscription(key){
  DISMISSED_SUBS.push(key);
  try{ DB.save('dismissed_subs',DISMISSED_SUBS); }catch(e){}
  renderRec();
  toast('Öneri gizlendi','warn');
}

// CHOICE SHEET — replaces native confirm()
// ═══════════════════════════════════════════════════
// A native confirm() only has two outcomes, so a three-way question had to map
// "Cancel" onto a real action — meaning Escape or a stray tap silently triggered
// it. Here dismissing always resolves to null, so the safe path is the default.
let _askResolve=null, _askChoices=[];
function askChoice({title,msg,choices,cancel='Vazgeç'}){
  return new Promise(resolve=>{
    if(_askResolve){ _askResolve(null); }
    _askResolve=resolve; _askChoices=choices;
    document.getElementById('ask-title').textContent=title;
    const mEl=document.getElementById('ask-msg');
    mEl.textContent=msg||''; mEl.style.display=msg?'block':'none';
    document.getElementById('ask-choices').innerHTML=
      choices.map((c,i)=>`<button class="ask-btn ${c.tone||''}" onclick="_askPick(${i})">
          <span class="ask-btn-label">${escapeHTML(c.label)}</span>
          ${c.hint?`<span class="ask-btn-hint">${escapeHTML(c.hint)}</span>`:''}
        </button>`).join('')+
      `<button class="ask-btn cancel" onclick="_askPick(-1)"><span class="ask-btn-label">${escapeHTML(cancel)}</span></button>`;
    document.getElementById('ask-overlay').classList.add('open');
  });
}
function _askPick(i){
  document.getElementById('ask-overlay').classList.remove('open');
  const r=_askResolve; _askResolve=null;
  if(r) r(i<0?null:_askChoices[i].value);
}
// Shorthand for a plain yes/no where "no" is the safe default.
function askConfirm(title,msg,okLabel='Sil',tone='danger'){
  return askChoice({title,msg,choices:[{label:okLabel,value:true,tone}]}).then(v=>v===true);
}

function renderBudget(){
  const txs=txsFor(bmY,bmM);
  const bgt=getBudgetForMonth(bmY,bmM);
  const isCurrentMonth=(bmY===CY&&bmM===CM);
  // Check if budget was carried over from a previous month
  const curKey=mStr(bmY,bmM);
  const budgetIsCarryOver=!BUDGET_HISTORY[curKey]&&Object.keys(BUDGET_HISTORY).some(k=>k<curKey);
  const carryOverFrom=budgetIsCarryOver?(()=>{const keys=Object.keys(BUDGET_HISTORY).filter(k=>k<curKey).sort();return keys.length?keys[keys.length-1]:null;})():null;
  const totalB=Object.values(bgt).reduce((s,v)=>s+v,0);
  const totalS=sumExp(txs);
  const pctTotal=totalB>0?Math.min(totalS/totalB*100,100):0;
  const overCount=CATS.filter(c=>c.id!=='salary').filter(cat=>{
    const b=getBudgetRemaining(cat.id,bmY,bmM);
    return b&&b.over;
  }).length;

  const cards=CATS.filter(c=>c.id!=='salary').map(cat=>{
    const b=getBudgetRemaining(cat.id,bmY,bmM);
    const spent=b?b.spent:txs.filter(t=>t.type==='expense'&&t.cat===cat.id).reduce((s,t)=>s+t.amt,0);
    const lim=b?b.lim:0;
    const pct=b?b.pct:0;
    const over=b?b.over:false;
    const warn=lim>0&&pct>=80&&!over;
    const barColor=over?'var(--red)':warn?'var(--amber)':cat.color;
    const badge=lim>0?(over?'<span class="badge badge-red">Aşıldı</span>':warn?'<span class="badge badge-amber">Yaklaşıyor</span>':'<span class="badge badge-green">Yolunda</span>'):'<span class="badge badge-gray">Bütçe yok</span>';
    const presets=[500,1000,2000,3000,5000,8000,10000];

    return `<div class="bgt-card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:${lim>0?'14px':'10px'};cursor:pointer" onclick="showCatTxSheet('${cat.id}',${bmY},${bmM})">
        <div style="width:44px;height:44px;border-radius:14px;background:${cat.bg};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">${cat.icon}</div>
        <div style="flex:1"><div style="font-size:15px;font-weight:800;margin-bottom:3px">${escapeHTML(cat.name)} <span style="color:var(--text3);font-weight:600">›</span></div>${badge}</div>
        <div style="text-align:right"><div style="font-size:17px;font-weight:800;color:${spent>0?'var(--red)':'var(--text3)'}">${fmt(spent)}</div><div style="font-size:11px;color:var(--text3)">${lim>0?'/ '+fmt(lim):'limit yok'}</div></div>
      </div>
      ${lim>0?`<div class="prog-track"><div class="prog-bar" style="width:${pct}%;background:${barColor}"></div></div><div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text3);font-weight:700"><span>%${Math.round(pct)} kullanıldı</span><span style="color:${over?'var(--red)':'var(--text3)'}">${over?'−'+fmt(b.remaining)+' aşım':fmt(b.remaining)+' kaldı'}</span></div>`:''}
      <div class="preset-grid">${presets.map(v=>`<button onclick="setBgtUI('${cat.id}',${v})" class="preset-btn ${lim===v?'active':''}">${v>=1000?v/1000+'B':v}</button>`).join('')}</div>
      <div class="bgt-custom-wrap">
        <input class="bgt-custom-input" type="number" min="1" max="100000000" placeholder="Özel ₺" id="bgt-custom-${cat.id}" onkeydown="if(event.key==='Enter')setBgtCustomUI('${cat.id}')"/>
        <button class="bgt-custom-btn" onclick="setBgtCustomUI('${cat.id}')">Ayarla</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('pg-budget').innerHTML=`
    <div class="pg-hdr"><div class="pg-title">Bütçe</div></div>
    <div class="mnav">
      <button class="mnav-btn" onclick="chBM(-1)">‹</button>
      <div class="mnav-label">${mName(bmM)} ${bmY}</div>
      <button class="mnav-btn" onclick="chBM(1)">›</button>
    </div>
    <div style="padding:0 14px 16px">
      <div class="hero">
        <div class="hero-eyebrow">Aylık Bütçe · ${mName(bmM)} ${bmY}${!isCurrentMonth?' · <span style="color:rgba(90,171,255,.7)">Geçmiş Ay</span>':''}${carryOverFrom?` · <span style="color:rgba(255,170,68,.75)">↑ ${carryOverFrom} devir</span>`:''}</div>
        <div class="hero-balance">${fmt(totalB)}</div>
        <div class="hero-balance-sub">${fmt(totalS)} harcandı · %${Math.round(pctTotal)}${overCount>0?` · <span style="color:var(--red)">${overCount} aşım</span>`:''}</div>
        <div class="hero-divider"></div>
        <div style="height:10px;background:var(--hero-line);border-radius:99px;overflow:hidden"><div style="height:100%;border-radius:99px;width:${pctTotal}%;background:${pctTotal>=100?'var(--red)':pctTotal>=80?'var(--amber)':'var(--green)'};transition:width .8s ease"></div></div>
      </div>
    </div>
    <div style="padding:0 14px;margin-bottom:12px">
      <div class="backup-row">
        <button class="backup-btn" onclick="exportJSON()">📦 JSON Yedek</button>
        <button class="backup-btn" onclick="document.getElementById('import-file').click()">📥 İçe Aktar</button>
        <button class="backup-btn danger" onclick="resetAllData()">🗑 Sıfırla</button>
      </div>

    <div style="padding:0 14px 10px;display:flex;justify-content:space-between;align-items:center"><div style="font-size:15px;font-weight:800">Kategori Bütçeleri</div><div style="font-size:11px;color:var(--text3)">Preset veya özel değer gir</div></div>
    ${cards}
    <div style="height:20px"></div>`;
}

// Calculate the next scheduled date for a template after today
function nextRecDate(tmpl){
  if(!tmpl.active) return null;
  const today=todayStr();
  if(tmpl.freq==='monthly'){
    // Find first month >= today that doesn't have a generated instance yet
    let y=CY, m=CM;
    for(let i=0;i<24;i++){
      const key=tmpl.id+'|M|'+mStr(y,m);
      const hasInstance=TXS.some(t=>t.recurringId===tmpl.id&&t.date.startsWith(mStr(y,m)));
      const instanceDate=ds(y,m,Math.min(tmpl.dayOfMonth,new Date(y,m,0).getDate()));
      if(!hasInstance&&instanceDate>today) return instanceDate;
      if(!hasInstance&&instanceDate<=today) return instanceDate; // due today or overdue
      m++; if(m>12){m=1;y++;}
    }
  }
  if(tmpl.freq==='weekly'){
    const startMs=new Date(tmpl.startDate+'T12:00:00').getTime();
    const todayMs=new Date(today+'T12:00:00').getTime();
    const weekMs=7*24*60*60*1000;
    const elapsed=Math.ceil((todayMs-startMs)/weekMs);
    const nextMs=startMs+(elapsed*weekMs);
    const d=new Date(nextMs);
    return ds(d.getFullYear(),d.getMonth()+1,d.getDate());
  }
  return null;
}

// Count generated instances for a template
function instanceCount(tmplId){
  return TXS.filter(t=>t.recurringId===tmplId).length;
}

// Simulate: what WOULD happen if today were one period ahead?
function simulateNext(tmplId){
  const tmpl=REC_TEMPLATES.find(r=>r.id===tmplId);
  if(!tmpl){toast('Şablon bulunamadı','error');return;}

  const count=instanceCount(tmplId);
  const maxOcc=tmpl.occurrences>0?tmpl.occurrences:null;

  if(maxOcc&&count>=maxOcc){
    toast('Bu seri tamamlandı, yeni kayıt üretilmez.','warn');
    return;
  }

  const c=gc(tmpl.cat);
  let nextDate=null;

  if(tmpl.freq==='monthly'){
    // Find next month after last generated instance
    const lastInst=TXS.filter(t=>t.recurringId===tmplId).map(t=>t.date).sort().pop();
    let y,m;
    if(lastInst){
      const d=new Date(lastInst+'T12:00:00');
      m=d.getMonth()+2; y=d.getFullYear();
      if(m>12){m=1;y++;}
    } else {
      const d=new Date(tmpl.startDate+'T12:00:00');
      m=d.getMonth()+1; y=d.getFullYear();
    }
    nextDate=ds(y,m,Math.min(tmpl.dayOfMonth,new Date(y,m,0).getDate()));
  } else if(tmpl.freq==='weekly'){
    const lastInst=TXS.filter(t=>t.recurringId===tmplId).map(t=>t.date).sort().pop();
    const baseMs=lastInst
      ?new Date(lastInst+'T12:00:00').getTime()
      :new Date(tmpl.startDate+'T12:00:00').getTime();
    const d=new Date(baseMs+7*24*60*60*1000);
    nextDate=ds(d.getFullYear(),d.getMonth()+1,d.getDate());
  }

  if(!nextDate){toast('Sonraki tarih hesaplanamadı','error');return;}

  const occLabel=maxOcc?` (${count+1}/${maxOcc})`:'';

  // Show simulation result on the page
  const simBox=document.getElementById('sim-box-'+tmplId);
  if(simBox){
    simBox.style.display='block';
    simBox.innerHTML=`<div class="sim-box-title">✅ Simülasyon Sonucu</div>
      <div class="sim-box-body">
        <b>${fmtD(nextDate)}</b> tarihinde şu kayıt otomatik oluşturulur:<br>
        ${c.icon} <b>${escapeHTML(tmpl.desc)}</b> — ${tmpl.type==='expense'?'Gider':'Gelir'} <b>${fmt(tmpl.amt)}</b>${occLabel}<br>
        Hesap: ${escapeHTML(ACCOUNTS[tmpl.account]||tmpl.account)} · Kategori: ${escapeHTML(c.name)} › ${escapeHTML(tmpl.sub)}
      </div>`;
    simBox.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

async function stopTemplate(tmplId){
  if(!await askConfirm('Düzenli işlem durdurulsun mu?','Yeni kayıt üretilmez. Şimdiye kadar oluşan kayıtlar silinmez.','Durdur','')) return;
  REC_TEMPLATES=REC_TEMPLATES.map(r=>r.id===tmplId?{...r,active:false}:r);
  saveTemplates();
  renderRec();
  toast('Düzenli işlem durduruldu','warn');
}

function restartTemplate(tmplId){
  REC_TEMPLATES=REC_TEMPLATES.map(r=>r.id===tmplId?{...r,active:true}:r);
  saveTemplates();
  processRecurring();
  renderRec();
  toast('Düzenli işlem yeniden başlatıldı');
}

async function deleteTemplate(tmplId){
  const n=TXS.filter(t=>t.recurringId===tmplId).length;
  if(!await askConfirm('Şablon silinsin mi?',`Bu seriden oluşmuş ${n} kayıt da silinecek. Geri alınamaz.`,'Şablonu ve kayıtları sil')) return;
  TXS=TXS.filter(t=>t.recurringId!==tmplId);
  REC_TEMPLATES=REC_TEMPLATES.filter(r=>r.id!==tmplId);
  saveTxs(); saveTemplates();
  renderRec();
  toast('Düzenli işlem silindi','error');
}

  function buildCard(tmpl){
    const c=gc(tmpl.cat);
    const count=instanceCount(tmpl.id);

    const isDone=maxOcc&&count>=maxOcc;

    // Status badge

    } else {
      statusBadge='<span class="rec-status-badge rsb-active">● Aktif</span>';

    if(maxOcc){
      const pct=Math.min((count/maxOcc)*100,100);
      const barColor=isDone?'var(--green)':pct>=80?'var(--amber)':'var(--blue)';
      progressHTML=`<div class="rec-progress">
        <div class="rec-prog-track"><div class="rec-prog-bar" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="rec-prog-label">

    }

    // Next date row + action buttons
    let nextHTML='';

        </div>
        <div class="rec-actions">
          <button class="rec-act-btn stop" onclick="deleteTemplate('${tmpl.id}')">🗑 Sil</button>
        </div>

    const startFormatted=fmtD(tmpl.startDate);

  }

  el.innerHTML=`

      ${totalIncome?`<div class="scard"><div class="scard-label">Aylık Gelir</div><div class="scard-val" style="color:var(--green)">${fmt(totalIncome)}</div></div>`:''}
    </div>`:''}

    ${sugHTML}

    <div style="height:16px"></div>`;

function exportCSV(){
  const rows=[['Tarih','Tür','Tutar','Kategori','Alt Kategori','Açıklama','Hesap','Not','Düzenli']];
  [...TXS].sort((a,b)=>b.date.localeCompare(a.date)).forEach(t=>{
    rows.push([t.date,t.type===('income')?'Gelir':'Gider',t.amt,gc(t.cat).name,t.sub,`"${(t.desc||'').replace(/"/g,'""')}"`,t.account||'',`"${(t.note||'').replace(/"/g,'""')}"`,t.recurring?'Evet':'Hayır']);
  });
  const csv='\ufeff'+rows.map(r=>r.join(',')).join('\n'); // BOM for Excel
  downloadBlob(csv,'text/csv;charset=utf-8',`flowly-${todayStr()}.csv`);
  toast('CSV indirildi');
}

function exportJSON(){
  const backup={
    version:4,
    exportDate:new Date().toISOString(),
    txs:TXS,
    budgetHistory:BUDGET_HISTORY,
    cats:CATS,
    recTemplates:REC_TEMPLATES,
  };
  downloadBlob(JSON.stringify(backup,null,2),'application/json',`flowly-backup-${todayStr()}.json`);
  toast('JSON yedeği indirildi');
}

function downloadBlob(content,mime,filename){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importJSON(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      let data;
      try{ data=JSON.parse(e.target.result); }
      catch(parseErr){ throw new Error('Dosya geçerli bir JSON değil: '+parseErr.message); }

      // Schema check: must have txs array
      if(!data||typeof data!=='object') throw new Error('Geçersiz format: kök nesne bulunamadı');
      if(!Array.isArray(data.txs)) throw new Error('Geçersiz format: "txs" dizisi bulunamadı');

      // Version warning (not blocking)
      const ver=data.version||0;
      if(ver>4) console.warn('Fina: import version',ver,'> current 4 — may have unknown fields');

      // Validate and normalize transactions — reject silently invalid ones
      const importedTxs=data.txs
        .map(normalizeTx)
        .filter(t=>{
          const errs=validateTx(t);
          if(errs.length){ console.warn('Import: skipping tx',t.id,'reasons:',errs); }
          return errs.length===0;
        });

      if(!importedTxs.length) throw new Error('Geçerli işlem bulunamadı (tüm satırlar hatalı)');

      // Confirm before overwrite
      const skipped=data.txs.length-importedTxs.length;
      const pick=await askChoice({
        title:'Yedek geri yüklensin mi?',
        msg:`${importedTxs.length} işlem içe aktarılacak${skipped>0?` (${skipped} hatalı satır atlandı)`:''}. `+
            `Şu anki ${TXS.length} işlem ve tüm ayarların bunun yerine geçecek.`,
        choices:[
          {label:'Önce mevcut veriyi yedekle', value:'backup', hint:'JSON indirir, içe aktarma iptal olur', tone:'primary'},
          {label:'Üzerine yaz',                value:'go',     hint:'Mevcut veriler silinir', tone:'danger'}
        ]
      });
      if(pick==='backup'){ exportJSON(); input.value=''; return; }
      if(pick!=='go'){ input.value=''; return; }

      // Apply — in this order so CATMAP is ready before normalizeTx calls gc()
      if(data.cats&&Array.isArray(data.cats)&&data.cats.length>0){
        CATS=data.cats.map(c=>({...c,isSystem:SYS_CAT_IDS.includes(c.id),bg:c.bg||'rgba(128,128,128,.15)'}));
        SYS_CAT_IDS.forEach(sid=>{
          if(!CATS.find(c=>c.id===sid)){
            const def=DEFAULT_CATS.find(c=>c.id===sid);
            if(def) CATS.push({...def});
          }
        });
        CATMAP=buildCatMap();
        saveCats();
      }

      TXS=importedTxs;
      saveTxs();

      if(data.budgetHistory&&typeof data.budgetHistory==='object'&&!Array.isArray(data.budgetHistory)){
        // Sanitize: ensure all budget values are valid numbers
        const cleanBH={};
        for(const [monthKey,catBgts] of Object.entries(data.budgetHistory)){
          if(!/^\d{4}-\d{2}$/.test(monthKey)) continue;
          if(typeof catBgts!=='object'||!catBgts) continue;
          cleanBH[monthKey]={};
          for(const [catId,val] of Object.entries(catBgts)){
            const v=validateBudgetValue(val);
            if(v!==null) cleanBH[monthKey][catId]=v;
          }
        }
        BUDGET_HISTORY=cleanBH;
        // Ensure current month has a budget entry
        if(!BUDGET_HISTORY[mStr(CY,CM)]){
          BUDGET_HISTORY[mStr(CY,CM)]={food:2000,transport:800,housing:10000,health:1500,fun:1000,shopping:2000,edu:500,savings:3000};
        }
        saveBudgetHistory();
      }

      if(data.recTemplates&&Array.isArray(data.recTemplates)){
        // Validate templates: must have id, freq, startDate
        REC_TEMPLATES=data.recTemplates.filter(r=>
          r&&r.id&&VALID_FREQS.includes(r.freq)&&DATE_RE.test(r.startDate)
        );
        saveTemplates();
        processRecurring();
      }

      CATMAP=buildCatMap();
      toast(`${importedTxs.length} işlem içe aktarıldı`,'success');
      render(activePg);
    } catch(err){
      toast('İçe aktarma hatası: '+err.message,'error');
      console.error('Import error:',err);
    }
  };
  reader.readAsText(file);
  input.value='';
}

async function resetAllData(){
  const ok=await askChoice({
    title:'Tüm veriler silinsin mi?',
    msg:`${TXS.length} işlem, bütçeler, düzenli şablonlar ve kategoriler kalıcı olarak silinir. Bu işlem geri alınamaz — önce yedek almanı öneririm.`,
    choices:[
      {label:'Önce yedek al',      value:'backup', hint:'JSON dosyasını indirir, veriler silinmez', tone:'primary'},
      {label:'Her şeyi sil',       value:'wipe',   hint:'Kalıcı olarak siler', tone:'danger'}
    ]
  });
  if(ok==='backup'){ exportJSON(); return; }
  if(ok!=='wipe') return;
  TXS=[];
  BUDGET_HISTORY={};
  BUDGET_HISTORY[mStr(CY,CM)]={};
  CATS=[...DEFAULT_CATS];
  REC_TEMPLATES=[];
  CATMAP=buildCatMap();
  saveTxs(); saveBudgetHistory(); saveCats(); saveTemplates();
  toast('Tüm veriler silindi','warn');
  render(activePg);
}
